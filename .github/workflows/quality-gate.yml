name: quality-gate

on: pull_request

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" || true
        env:
          BASE_BRANCH: ${{ github.base_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build refunds dashboard
        run: pnpm --filter @acme/refunds-dashboard build

      - name: Test
        run: pnpm test:ci

      - name: Test-count baseline guard
        run: node scripts/check-test-baseline.mjs
        env:
          BASE_REF: origin/${{ github.base_ref }}
